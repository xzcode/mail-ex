[package]
name = "mail-ex"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mail-ex-core = { path = "../core" }
anyhow = "1"

tauri-plugin-dialog = "2"

open = "5"

serde_json = "1"
uuid = { version = "1", features = ["v4"] }

tauri-plugin-notification = "2"
