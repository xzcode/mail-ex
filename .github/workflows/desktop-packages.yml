name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
            artifact: linux-deb
          - os: windows-latest
            bundles: nsis
            artifact: windows-nsis
          - os: macos-latest
            bundles: dmg
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - name: Loopback protocol fixture
        if: runner.os == 'Linux'
        run: python3 scripts/protocol-fixture.py
      - name: Build desktop installer
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }}
      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- core/Cargo.lock src-tauri/Cargo.lock package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: mail-ex-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
