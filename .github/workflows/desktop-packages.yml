name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Build target platforms'
        required: true
        default: desktop
        type: choice
        options: [desktop, all, linux, windows, macos]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'windows' && '[{"os":"windows-2025","bundles":"nsis","artifact":"windows-x64"}]' || inputs.platforms == 'macos' && '[{"os":"macos-15","bundles":"dmg","artifact":"macos-arm64"},{"os":"macos-15-intel","bundles":"dmg","artifact":"macos-x64"}]' || inputs.platforms == 'linux' && '[{"os":"ubuntu-24.04","bundles":"deb","artifact":"linux-x64"}]' || inputs.platforms == 'all' && '[{"os":"ubuntu-24.04","bundles":"deb","artifact":"linux-x64"},{"os":"windows-2025","bundles":"nsis","artifact":"windows-x64"},{"os":"macos-15","bundles":"dmg","artifact":"macos-arm64"},{"os":"macos-15-intel","bundles":"dmg","artifact":"macos-x64"}]' || '[{"os":"windows-2025","bundles":"nsis","artifact":"windows-x64"},{"os":"macos-15","bundles":"dmg","artifact":"macos-arm64"},{"os":"macos-15-intel","bundles":"dmg","artifact":"macos-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust
        run: rustup update stable && rustup default stable && rustc --version
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config xvfb xauth dbus-x11
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --fetch-retries=2 --fetch-timeout=60000
      - name: npm failure diagnostics
        if: failure()
        shell: bash
        run: |
          npm --version
          node --version
          npm config get registry
      - run: npm run build
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - name: Loopback protocol fixture
        if: runner.os == 'Linux'
        run: python3 scripts/protocol-fixture.py
      - name: Build desktop installer
        if: runner.os != 'macOS'
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }}
      - name: Build ad-hoc signed macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          npm run tauri -- build --ci --bundles dmg
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          mount_dir=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null || true; rmdir "$mount_dir" || true' EXIT
          codesign --verify --deep --strict "$mount_dir/Mail EX.app"
          file "$mount_dir/Mail EX.app/Contents/MacOS/mail-ex"
      - name: Linux optimized startup
        if: runner.os == 'Linux'
        run: bash scripts/release-smoke.sh src-tauri/target/release/mail-ex
      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- core/Cargo.lock src-tauri/Cargo.lock package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: mail-ex-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
