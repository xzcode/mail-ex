[package]
name = "mail-ex-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
imap = "2.4.1"
native-tls = "0.2"
lettre = "0.11"
mailparse = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

ammonia = "4"
html-escape = "0.2"
serde_json = "1"

sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }

csv = "1.3"

chrono = { version = "0.4", features = ["clock"] }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"

